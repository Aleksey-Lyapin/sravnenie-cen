<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Сравнение цен BAZA</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: white sticky header with BAZA mark and project pills; filters; KPI strip; 2-column chart grid; full-width tables.
   Palette follows baza.bz: navy ink on pale blue ground, white 20px cards, brand red marks our project.
   Single light theme on purpose, as on baza.bz. */
:root {
  color-scheme: light;
  --bg: #F5F8FB;
  --surface: #FFFFFF;
  --surface-2: #EDF6FF;
  --ink: #002346;
  --ink-2: #3E5C7C;
  --muted: #6C8DAF;
  --line: #D8E6F4;
  --line-strong: #BFD4E8;
  --own: #E20617;
  --own-hover: #B50C20;
  --own-soft: rgba(226,6,23,.05);
  --market: #002346;
  --comp: #BFD4E8;
  --comp-pt: rgba(108,141,175,.42);
  --band: rgba(108,141,175,.16);
  --range: #355E8E;
  --w1: #FEF3F3; --w2: #FBDADC; --w3: #F6B4B9;
  --c1: #EDF6FF; --c2: #D8E6F4; --c3: #BFD4E8;
  --r1: #BFD4E8; --r2: #6C8DAF; --r3: #3E6690; --r4: #1D4166; --r5: #002346;
  --focus: #6C8DAF;
  --shadow: 0 0 16px 0 rgba(0,35,70,.10);
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Unbounded", "Inter", system-ui, sans-serif;
  --radius: 20px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 0 48px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); box-shadow: 0 4px 16px rgba(0,35,70,.06); }
.top-inner { max-width: 1320px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
@media (max-width: 520px) { .top-inner { padding-inline: 16px; } }
.brand { display: flex; gap: 16px; align-items: center; min-width: 0; }
.logo { width: 64px; height: 47px; flex: none; display: block; }
.logo svg { width: 100%; height: 100%; display: block; }
.brand-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding-left: 16px; border-left: 1px solid var(--line); }
.eyebrow { font-size: 12px; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 500; padding: 10px 18px; border-radius: 100px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; transition: background-color .15s, border-color .15s; }
.tab:hover { background: var(--bg); }
.tab[aria-selected="true"], .tab[aria-pressed="true"] { background: var(--own); border-color: var(--own); color: #FFFFFF; }
.tab[aria-selected="true"]:hover, .tab[aria-pressed="true"]:hover { background: var(--own-hover); }
.tab[aria-pressed="true"]::before { content: "✓"; font-weight: 700; }
.tab .cnt { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
.nav-sec { margin-left: 28px; display: flex; gap: 8px; flex-wrap: wrap; }
/* «Свод сделок Екб» на широком экране: шапка в одну строку */
@media (min-width: 1100px) {
  .top:has(#nav-edeals[aria-pressed="true"]) .top-inner { flex-wrap: nowrap; gap: 12px 16px; }
  .top:has(#nav-edeals[aria-pressed="true"]) .brand { flex: 1 1 auto; }
  .top:has(#nav-edeals[aria-pressed="true"]) .nav-sec { margin-left: 20px; flex: none; flex-wrap: nowrap; }
  .top:has(#nav-edeals[aria-pressed="true"]) .tabs { flex: none; flex-wrap: nowrap; }
}
.tabs-break { display: none; }
/* «Предложение»: кнопки проектов (Алиса / ДНК / Милый дом / РЖД) прижаты вправо */
.top:has(#nav-offer[aria-pressed="true"]) .tabs { margin-left: auto; justify-content: flex-end; }
/* «Сделки» и «Сделки конкурентов»: с пятой кнопкой раздела («Лот к лоту») проекты не помещаются в одну строку — переносятся вниз вправо */
.top:has(#nav-cdeals[aria-pressed="true"]) .tabs, .top:has(#nav-deals[aria-pressed="true"]) .tabs { margin-left: auto; justify-content: flex-end; }
.nav-btn { appearance: none; font: inherit; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 100px; border: 1.5px solid var(--own); background: var(--surface); color: var(--own); cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s; }
.nav-btn:hover { background: var(--w1); }
.nav-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; cursor: default; }
.nav-btn[aria-pressed="true"]:hover { background: var(--ink); }
.period { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.period select { font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 100px; background: var(--surface); color: var(--ink); cursor: pointer; }
td.wrap { white-space: normal; min-width: 160px; }
/* длинный формат скидки переносится по словам */
#tbl-deals td.fmt-wrap { white-space: normal; min-width: 200px; max-width: 260px; line-height: 1.35; }
/* таблица сделок: краткий вид помещается по ширине, у подробного ползунок прокрутки ещё и сверху */
#tbl-deals.short th { white-space: normal; }
#tbl-deals.short th, #tbl-deals.short td { padding: 8px 6px; font-size: 12.5px; }
#tbl-deals.short td.fin-wrap { white-space: normal; min-width: 110px; max-width: 170px; line-height: 1.35; }
.tbl-topscroll { overflow-x: auto; overflow-y: hidden; margin-inline: -4px; }
.tbl-topscroll > div { height: 1px; }
button:focus-visible, input:focus-visible, summary:focus-visible, th:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.filters { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-top: 20px; padding: 18px 20px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.fgroup { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.flabel { font-size: 12px; color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; font: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 100px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.chip:hover { background: var(--bg); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 100px; background: var(--bg); border: 1px solid var(--line); }
.seg button { appearance: none; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 13px; border-radius: 100px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,35,70,.14); }
.area { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.area input { width: 76px; font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 100px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; }
.area input::placeholder { color: var(--muted); }
.dd { position: relative; }
.dd summary { list-style: none; cursor: pointer; font-size: 13px; font-weight: 500; padding: 7px 34px 7px 14px; border: 1px solid var(--line); border-radius: 100px; background: var(--surface); color: var(--ink); position: relative; white-space: nowrap; }
.dd summary:hover { background: var(--bg); }
.dd summary::-webkit-details-marker { display: none; }
.dd summary::after { content: ""; position: absolute; right: 14px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateY(-70%) rotate(45deg); }
.dd[open] summary::after { transform: translateY(-30%) rotate(-135deg); }
.dd-panel { position: absolute; z-index: 30; top: calc(100% + 8px); left: 0; width: min(360px, calc(100vw - 32px)); max-height: 380px; overflow: auto; background: var(--surface); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,35,70,.18); padding: 8px; }
.dd-panel label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.dd-panel label:hover { background: var(--bg); }
.dd-panel label.off { color: var(--muted); cursor: default; }
#l-comps summary { padding-block: 9px; }
#c-view { align-self: flex-start; margin-top: 6px; }  /* «Сделки конкурентов»: вкладки «Обзор» / «Сравнение цен» под заголовком */
#tbl-pmatrix td.cell { text-align: right; white-space: nowrap; }
#tbl-pmatrix td.cell .pv { font-weight: 600; }
#tbl-psum { font-size: 12.5px; }
#tbl-psum th, #tbl-psum td { padding: 8px 6px; }
#tbl-psum th { white-space: normal; min-width: 58px; }
#tbl-psum td:first-child { min-width: 150px; white-space: normal; }  /* высота как у переключателей рядом — подписи фильтров в одну линию */
.dd-panel label .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.dd-panel input[type="checkbox"] { accent-color: var(--own); width: 16px; height: 16px; }
.dd-search { width: 100%; box-sizing: border-box; margin: 2px 0 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
.kpi .k-ours { display: block; margin-top: 4px; color: var(--ink-2); }
.kpi .k-ours b { color: var(--own); font-weight: 600; white-space: nowrap; }
#tbl-esum, #tbl-edev { font-size: 12.5px; }
#tbl-esum th, #tbl-esum td, #tbl-edev th, #tbl-edev td { padding: 8px 6px; }
#tbl-esum th, #tbl-edev th { white-space: normal; min-width: 52px; }
#tbl-esum td.l, #tbl-edev td.l { white-space: normal; }
#tbl-esum td:first-child, #tbl-edev td:first-child { min-width: 130px; }
#tbl-edev td.projs { min-width: 220px; max-width: 360px; color: var(--ink-2); }
.erank-bar { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; margin-top: 8px; }
.erank-bar h2 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
.erank-bar .sub { font-size: 13px; color: var(--muted); margin: 0; }
#e-projs .dd-panel { width: min(440px, calc(100vw - 32px)); max-height: 440px; }
.dd-panel label.own-p { color: var(--own); font-weight: 600; }
.dd-actions { display: flex; gap: 14px; padding: 6px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.link-btn { appearance: none; border: 0; background: none; color: var(--own); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; }
.link-btn:hover { color: var(--own-hover); }
.reset { margin-left: auto; }

.note { font-size: 13px; color: var(--ink-2); margin: 14px 0 0; padding: 10px 16px; background: var(--surface-2); border-radius: 12px; }
.note b { color: var(--ink); font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-block: 20px; }
.kpi { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .k-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi .k-val { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.kpi .k-val small { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.kpi .k-sub { font-size: 12.5px; color: var(--ink-2); }
.kpi .k-sub .d { font-weight: 600; color: var(--ink); white-space: nowrap; }
/* выделенный показатель под основным значением (средняя площадь сделок) */
.kpi .k-accent { display: inline-flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 2px; padding: 4px 10px; border-radius: 10px; background: var(--w1); color: var(--own); font-size: 13px; font-weight: 500; }
.kpi .k-accent b { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
/* «Сделки»: семь плиток в одну строку */
#d-kpis { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
#d-kpis .kpi { padding: 16px; }
#d-kpis .kpi .k-val { font-size: 21px; }
#d-kpis .kpi .k-accent { padding: 3px 8px; }
#d-kpis .kpi .k-accent b { font-size: 15px; }
.kpi.own .k-val { color: var(--own); }

.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; min-width: 0; display: flex; flex-direction: column; gap: 12px; grid-column: 1 / -1; }
.card.third { grid-column: span 2; }
.card.half { grid-column: span 3; }
.card.full { grid-column: 1 / -1; }
@media (max-width: 1180px) { .card.third { grid-column: 1 / -1; } }
@media (max-width: 1000px) { .card.half { grid-column: 1 / -1; } }
@media (max-width: 520px) { .card { padding: 18px 16px; } }
.card.third { padding: 20px 18px; }
/* одинаковая высота шапки у трёх рейтингов, чтобы строки графиков стояли на одном уровне */
.card.third h2 { line-height: 1.3; min-height: 2.6em; }
.card.third .sub { line-height: 1.45; min-height: 2.9em; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.seg-sm button { font-size: 12px; padding: 5px 11px; }
.insight { margin: 0; font-size: 13px; color: var(--ink); background: var(--bg); border-radius: 12px; padding: 9px 14px; }
.insight:empty { display: none; }
.insight b { font-weight: 600; }
.card h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.card .sub { font-size: 13px; color: var(--muted); margin: -4px 0 0; }
.chart-box { position: relative; width: 100%; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
/* остатки Алисы и ДМД2: карточки встают прямо в сетку раздела «Сделки» */
.stock-host { display: contents; }
.stock-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi.stock-kpi { box-shadow: none; background: var(--surface-2); padding: 14px 16px; gap: 4px; }
.kpi.stock-kpi .k-val { font-size: 21px; }
.stock-charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; }
@media (max-width: 1000px) { .stock-charts { grid-template-columns: minmax(0, 1fr); } }
.stock-charts h3 { font-size: 14px; font-weight: 600; margin: 4px 0 6px; }
.stock-tbl th { white-space: normal; vertical-align: bottom; line-height: 1.3; }

.tbl-wrap { overflow-x: auto; margin-inline: -4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-weight: 500; color: var(--muted); vertical-align: bottom; background: var(--surface); }
thead th { border-bottom: 1px solid var(--line-strong); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th.sorted { color: var(--ink); }
th.sorted::after { content: " ↓"; color: var(--own); }
th.sorted.asc::after { content: " ↑"; }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
tbody tr:hover td { background: var(--bg); }
tr.own-row td, tbody tr.own-row:hover td { background: var(--own-soft); font-weight: 600; }
tr.own-row td:first-child { box-shadow: inset 3px 0 0 var(--own); color: var(--own); }
/* в матрице розовый и голубой заняты отклонениями, поэтому наш проект — тёмно-синяя строка */
#tbl-matrix tr.own-row td, #tbl-matrix tbody tr.own-row:hover td { background: var(--ink); color: #FFFFFF; border-bottom-color: var(--ink); }
#tbl-matrix tr.own-row td .sm { color: rgba(255,255,255,.72); }
#tbl-matrix tr.own-row td:first-child { color: #FFFFFF; box-shadow: inset 4px 0 0 var(--own); }
/* наши лоты и аналоги */
.ltabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -6px 0 2px; flex-wrap: wrap; }
.ltab { appearance: none; border: 0; background: none; font: inherit; font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--muted); padding: 8px 4px 12px; margin-right: 18px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ltab:hover { color: var(--ink); }
.ltab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--own); }
.an-controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; }
.checks { display: flex; gap: 16px; padding-block: 5px; }
.check { display: flex; gap: 7px; align-items: center; font-size: 13px; color: var(--ink); cursor: pointer; }
.check input { accent-color: var(--own); width: 16px; height: 16px; }
.pill { display: inline-flex; gap: 4px; align-items: center; padding: 3px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.dear { background: var(--w1); color: var(--own); box-shadow: inset 0 0 0 1px var(--w3); }
.pill.cheap { background: var(--surface-2); color: var(--r3); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill.par { background: var(--bg); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.pill.na { background: var(--bg); color: var(--muted); font-weight: 500; }
#tbl-an tr.clk { cursor: pointer; }
#tbl-an tr.clk:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
#tbl-an tr.clk.open td { background: var(--surface-2); }
#tbl-an .caret { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; }
#tbl-an td.ours-v { color: var(--own); font-weight: 600; }
#tbl-an tr.subrow > td { background: var(--bg); padding: 12px 14px 16px; }
#tbl-an tbody tr.subrow:hover > td { background: var(--bg); }
.anbox { display: flex; flex-direction: column; gap: 10px; white-space: normal; }
.an-per { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.an-p { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.an-p b { color: var(--ink); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
table.an-sub { background: var(--surface); border-radius: 12px; overflow: hidden; }
table.an-sub th, table.an-sub td { padding: 7px 10px; font-size: 12.5px; }/* рейтинги и последние сделки */
.rank-list { display: flex; flex-direction: column; gap: 10px; }
.rank-item { background: var(--bg); border-radius: 14px; padding: 12px 16px; display: grid; gap: 8px; }
.rank-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rank-n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 11.5px; font-weight: 600; display: grid; place-items: center; color: var(--ink-2); }
.rank-item:first-child .rank-n { background: var(--own); color: #FFFFFF; box-shadow: none; }
.rank-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-val { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rank-val small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.rank-bar { height: 6px; border-radius: 100px; background: var(--line); overflow: hidden; }
.rank-bar span { display: block; height: 100%; border-radius: 100px; background: var(--own); }
/* «Рейтинг агентств»: разбивка АВ агрегаторов на «АВ агенту» и «АВ агрегатору» */

  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const uniq = a => Array.from(new Set(a)).filter(x => x !== "" && x != null).sort();
  const roomKey = r => r === "студия" ? "студия" : r === "4" || r === "4+" ? "4+" : r;
  const monthLabel = m => MON[+m.slice(5, 7) - 1] + " " + m.slice(2, 4);
  const monthLong = m => ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"][+m.slice(5, 7) - 1] + " " + m.slice(0, 4);

  // ---------- данные (собирает build.py) ----------
  const LOCS = D.locs;                 // alisa / dmd2: { label, obj — ЖК в «Все сделки», own — проект в лотах, ownK — корпус (ДМД2 = 2), comps }
  const latest = D.latest, PERIOD = D.period;
  const FINISH_COST = D.finish;        // стоимость отделки «чистовая», ₽/м² (справочник K3:L17)
  const byProject = {};
  D.offer.rows.forEach(r => { const o = { p: D.offer.p[r[0]], k: r[1], rooms: r[2], area: r[3], price: r[4], disc: r[5], fl: r[6], plan: r[7] || "" }; (byProject[o.p] = byProject[o.p] || []).push(o); });
  const DEALS = D.deals.map(r => ({ obj: r[0], month: r[1], rooms: roomKey(r[2]), area: r[3], budget: r[4], mort: !!r[5] }));
  const CROWS = D.cdeals.rows.map(r => ({ p: D.cdeals.p[r[0]], month: r[1], rooms: r[2], area: r[3], budget: r[4], mort: !!r[6], ekb: !!r[5] }));
  const finCorr = r => r.fl === "чистовая" ? (FINISH_COST[r.p] || 0) : r.fl === "черновая" ? 5000 : 0;

  // ---------- графики ----------
  const charts = {};
  function kill(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
  function baseOpts() {
    const ink2 = cssv("--ink-2"), muted = cssv("--muted"), line = cssv("--line"), surface = cssv("--surface"), ink = cssv("--ink");
    Chart.defaults.font.family = cssv("--font-ui").split(",")[0].replace(/"/g, "") + ", system-ui, sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = muted;
    const o = {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { labels: { color: ink2, usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 14 } },
        tooltip: { backgroundColor: surface, titleColor: ink, bodyColor: ink2, borderColor: line, borderWidth: 1, padding: 10, cornerRadius: 8, boxPadding: 4, titleFont: { weight: "600" }, displayColors: true }
      }
    };
    Object.defineProperties(o, { grid: { value: line }, ink: { value: ink }, ink2: { value: ink2 }, muted: { value: muted } });
    return o;
  }
  function wrapLabel(p, max) {
    if (p.length <= max) return [p];
    const words = p.split(" "); const lines = [""];
    words.forEach(w => { const cur = lines[lines.length - 1]; if (cur && (cur + " " + w).length > max && lines.length < 2) lines.push(w); else lines[lines.length - 1] = cur ? cur + " " + w : w; });
    return lines.map(l => l.length > max + 6 ? l.slice(0, max + 4) + "…" : l);
  }

  // ---------- элементы управления ----------
  function segGroup(id, options, cur, onPick) {
    const el = document.getElementById(id);
    el.innerHTML = options.map(([v, l]) => `<button type="button" aria-pressed="${v === cur}" data-v="${esc(v)}">${esc(l)}</button>`).join("");
    el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { onPick(b.dataset.v); renderAll(); }));
  }
  document.addEventListener("click", e => { document.querySelectorAll("details.dd[open]").forEach(dd => { if (!dd.contains(e.target)) dd.open = false; }); });
  // открываем список влево, если справа не хватает места
  document.querySelectorAll("details.dd").forEach(dd => dd.addEventListener("toggle", () => {
    const p = dd.querySelector(".dd-panel");
    p.style.left = "0"; p.style.right = "auto";
    if (dd.open && p.getBoundingClientRect().right > document.documentElement.clientWidth - 8) { p.style.left = "auto"; p.style.right = "0"; }
  }));

  // ================= сравнение цен сделок и экспозиции =================
  // Алиса и ДМД2: цены договоров за последние 3 месяца выгрузки сделок конкурентов (наши — «Все сделки», конкуренты — лист «Сделки»)
  // против последних цен экспозиции (лоты в продаже из листа «Конкуренты рабочая» — последний срез раздела «Предложение»).
  // Вид — как вкладка «Прайс» дашборда БАЗА-РЖД (26.11.2026): плитки с медианами конкурентов, таблица нашего проекта и графики по комнатности.
  const CS = { loc: "alisa" };
  // наши лоты в продаже: Алиса — все корпуса; ДМД2 — «Милый дом (BAZA)», корпус «2» (корпус «1» — это ДМД1)
  const ownOffer = (loc, r) => r.p === LOCS[loc].own && (!LOCS[loc].ownK || String(r.k) === LOCS[loc].ownK);
  // наши сделки (лист «Все сделки»): цена в договоре, площадь с коэф. 0,3/0,5
  const cOwnRows = loc => DEALS.filter(d => d.obj === LOCS[loc].obj).map(d => ({ p: LOCS[loc].label, month: d.month, rooms: d.rooms, area: d.area, budget: d.budget, mort: d.mort }));
  const PC_PRICE = { disc: ["Со скидкой и отделкой", "цена со скидкой и корректировкой на отделку"], discnf: ["Со скидкой и без корр-ки на отделку", "цена со скидкой, без корректировки на отделку"], list: ["Прайс", "цена по прайсу"] };
  // «На графиках»: all — сделки и экспозиция, d — только сделки, e — только экспозиция; у нашего проекта всегда оба столбика
  const PC_CDATA = { all: "Сделки и экспозиция", d: "Только сделки", e: "Только экспозиция" };
  const PC = { comps: null, price: ["disc", "discnf", "list"].includes(store.get("pc.price")) ? store.get("pc.price") : "discnf", cdata: PC_CDATA[store.get("pc.cdata")] ? store.get("pc.cdata") : "all" };
  const pcPrice = r => PC.price === "list" ? r.price : PC.price === "discnf" ? r.disc - finCorr(r) * r.area : r.disc;
  // период сделок: последний месяц / 3 / 6 мес. / весь год — до последнего месяца, за который есть сделки конкурентов
  // (выгрузка Объектива идёт по конец прошлого месяца; последние 3 месяца считает build.py — D.period)
  const PC_PER = { "1": "Месяц", "3": "3 мес.", "6": "6 мес.", y: "Весь год" };
  PC.per = PC_PER[store.get("pc.per")] ? store.get("pc.per") : "3";
  // разрез: по комнатности или по площади с шагом 5 м² (как в БАЗА-РЖД)
  const PC_CUT = { rooms: "По комнатности", area: "По площади, шаг 5 м²" };
  PC.cut = PC_CUT[store.get("pc.cut")] ? store.get("pc.cut") : "rooms";
  // оплата: все сделки, только с ипотекой или без ипотеки (наши — «Тип оплаты», конкуренты — «Тип обременения» Объектива)
  const PC_PAY = { all: "Все", mort: "С ипотекой", cash: "Без ипотеки" };
  PC.pay = PC_PAY[store.get("pc.pay")] ? store.get("pc.pay") : "all";
  const payOk = r => PC.pay === "all" || (PC.pay === "mort") === !!r.mort;
  // раскрытые комнатности в таблице проекта (разрез по площади); по умолчанию все свёрнуты
  PC.open = (() => { try { const v = JSON.parse(store.get("pc.open") || "[]"); return new Set(Array.isArray(v) ? v : []); } catch (e) { return new Set(); } })();
  const nextM = m => +m.slice(5) === 12 ? `${+m.slice(0, 4) + 1}-01` : `${m.slice(0, 4)}-${String(+m.slice(5) + 1).padStart(2, "0")}`;
  const DATA_FROM = CROWS.reduce((a, r) => r.month < a ? r.month : a, PERIOD[0]);
  const pcMonths = (per = PC.per) => {
    const last = PERIOD[PERIOD.length - 1], all = [];
    for (let m = DATA_FROM; m <= last; m = nextM(m)) all.push(m);
    return per === "y" ? all.filter(m => m >= last.slice(0, 4) + "-01") : all.slice(-(+per));
  };
  PC_PER.y = `Весь ${PERIOD[PERIOD.length - 1].slice(0, 4)}`;
  const pcPer = ms => !ms.length ? "" : ms.length === 1 ? monthLabel(ms[0]) : `${monthLabel(ms[0])} – ${monthLabel(ms[ms.length - 1])}`;
  const pcCompAll = () => LOCS[CS.loc].comps;
  // чистовая отделка у этих проектов — опция за доплату (по словам заказчика, 26.11.2026)
  const FIN_OPTION = new Set(["Алиса", "ДМД2", "Сибирский сад", "Чаадаев", "Да на Амундсена", "Да на Амундсена (Гринвич)"]);
  const ROOM_LONG = { "студия": "Студии", "1": "1-комн", "2": "2-комн", "3": "3-комн", "4+": "4-комн и больше" };
  const median = a => { const s = a.slice().sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
  // конкуренты локации: сколько у каждого сделок за период и лотов в продаже
  function pcAvail() {
    const ms = pcMonths(), from = ms[0], to = ms[ms.length - 1], dn = {};
    CROWS.forEach(r => { if (r.month >= from && r.month <= to) dn[r.p] = (dn[r.p] || 0) + 1; });
    return pcCompAll().map(p => ({ p, d: dn[p] || 0, o: (byProject[p] || []).length }));
  }
  function pcReset() {
    PC.comps = new Set(pcAvail().filter(x => x.d || x.o).map(x => x.p));
  }
  function pcView() {
    const ms = pcMonths(), from = ms[0] || "", to = ms[ms.length - 1] || "";
    const lbl = LOCS[CS.loc].label;
    const rk = r => roomKey(r.rooms), inP = r => r.month >= from && r.month <= to;
    const ok = r => r.area > 0 && r.budget > 0;
    const dOwn = cOwnRows(CS.loc).filter(r => inP(r) && payOk(r)).map(r => ({ p: lbl, month: r.month, rooms: rk(r), area: r.area, budget: r.budget })).filter(ok);
    const dComp = CROWS.filter(r => PC.comps.has(r.p) && inP(r) && payOk(r)).map(r => ({ p: r.p, month: r.month, rooms: rk(r), area: r.area, budget: r.budget })).filter(ok);
    const toO = p => r => ({ p, rooms: rk(r), area: r.area, budget: pcPrice(r) });
    const oOwn = (byProject[LOCS[CS.loc].own] || []).filter(r => ownOffer(CS.loc, r)).map(toO(lbl)).filter(ok);
    const oComp = pcCompAll().filter(p => PC.comps.has(p)).flatMap(p => (byProject[p] || []).map(toO(p))).filter(ok);
    const later = uniq(cOwnRows(CS.loc).filter(r => r.month > to).map(r => r.month)).sort();
    return { ms, from, to, lbl, dOwn, dComp, oOwn, oComp, later };
  }
  function pst(L) {
    if (!L || !L.length) return null;
    let a = 0, b = 0; L.forEach(r => { a += r.area; b += r.budget; });
    return { n: L.length, ppm: b / a, budget: b / L.length, area: a / L.length };
  }
  // группы разреза: комнатности или, как в БАЗА-РЖД, диапазоны площади по 5 м² внутри каждой комнатности
  // (диапазоны — по нашим сделкам за период и нашим лотам этой комнатности; сделки попадают в диапазон по площади с коэф. 0,3/0,5, лоты — с коэф. 1)
  const bk5 = a => Math.floor(a / 5) * 5;
  function pcGroups(V) {
    if (PC.cut === "rooms") return ROOMS.map(x => ({ x, t: x, label: ROOM_LONG[x], short: ROOM_LONG[x], test: r => r.rooms === x }));
    return ROOMS.flatMap(t => {
      const bs = Array.from(new Set(V.dOwn.concat(V.oOwn).filter(r => r.rooms === t).map(r => bk5(r.area)))).sort((a, b) => a - b);
      return bs.map(b => ({ x: `${t}|${b}`, t, label: `${ROOM_LONG[t]}, ${b}–${b + 5} м²`, short: `${b}–${b + 5} м²`, test: r => r.rooms === t && bk5(r.area) === b }));
    });
  }
  // одна группа: наш проект, конкуренты и медианы цены м² по проектам (как в БАЗА-РЖД)
  function pcRoom(V, g) {
    const f = L => L.filter(g.test), x = g.x;
    const by = L => { const o = {}; f(L).forEach(r => (o[r.p] = o[r.p] || []).push(r)); return o; };
    const dB = by(V.dComp), oB = by(V.oComp);
    const comps = pcCompAll().filter(p => PC.comps.has(p) && (dB[p] || oB[p])).map(p => ({ p, sd: pst(dB[p]), so: pst(oB[p]) }));
    const own = { p: V.lbl, own: true, sd: pst(f(V.dOwn)), so: pst(f(V.oOwn)) };
    return { x, t: g.t, label: g.label, short: g.short, own, comps, medD: median(comps.filter(c => c.sd).map(c => c.sd.ppm)), medE: median(comps.filter(c => c.so).map(c => c.so.ppm)),
      areaD: median(comps.filter(c => c.sd).map(c => c.sd.area)), areaE: median(comps.filter(c => c.so).map(c => c.so.area)) };
  }
  // итог по всем комнатностям: медианы групп взвешены по нашей площади в группе (сделки — по площади наших сделок, экспозиция — наших лотов)
  function pcTotal(R) {
    // ср. площадь — медиана средних площадей проектов в группе, сведённая с теми же весами (как areaE / areaD в БАЗА-РЖД)
    const w = (k, m, am) => { let sw = 0, sm = 0, so = 0, wa = 0, sa = 0; R.forEach(a => { const s = a.own[k], md = a[m]; if (!s || md == null) return; const wt = s.area * s.n; sw += wt; sm += wt * md; so += wt * s.ppm; if (a[am] != null) { wa += wt; sa += wt * a[am]; } }); return sw ? { med: sm / sw, dev: so / sm - 1, area: wa ? sa / wa : null } : null; };
    return { D: w("sd", "medD", "areaD"), E: w("so", "medE", "areaE") };
  }
  const pill = (v, who) => v == null ? `<span class="pill na">${who}: нет данных для сравнения</span>`
    : `<span class="pill ${v > .005 ? "dear" : v < -.005 ? "cheap" : "par"}">${who}: ${v > .005 ? "дороже" : v < -.005 ? "дешевле" : "на уровне"} медианы${Math.abs(v) > .005 ? " на " + nf1.format(Math.abs(v * 100)) + " %" : ""}</span>`;

  function renderPcFilters() {
    segGroup("p-price", Object.entries(PC_PRICE).map(([k, v]) => [k, v[0]]), PC.price, v => { PC.price = v; store.set("pc.price", v); });
    segGroup("p-cdata", Object.entries(PC_CDATA), PC.cdata, v => { PC.cdata = v; store.set("pc.cdata", v); });
    segGroup("p-cut", Object.entries(PC_CUT), PC.cut, v => { PC.cut = v; store.set("pc.cut", v); });
    segGroup("p-pay", Object.entries(PC_PAY), PC.pay, v => { PC.pay = v; store.set("pc.pay", v); });
    segGroup("p-per", Object.entries(PC_PER), PC.per, v => { PC.per = v; store.set("pc.per", v); });
    const av = pcAvail(), have = av.filter(x => x.d || x.o).map(x => x.p);
    const panel = document.getElementById("p-comps-panel");
    panel.innerHTML = `<div class="dd-actions"><button class="link-btn" type="button" data-a="all">Выбрать всех</button><button class="link-btn" type="button" data-a="none">Снять всех</button></div>` +
      av.map(x => (x.d || x.o) ? `<label><input type="checkbox" data-p="${esc(x.p)}" ${PC.comps.has(x.p) ? "checked" : ""}>${esc(x.p)}<span class="n">${x.d} сд. · ${x.o} лот.</span></label>`
                             : `<label class="off"><input type="checkbox" disabled>${esc(x.p)}<span class="n">нет данных</span></label>`).join("");
    panel.querySelectorAll("input[data-p]").forEach(cb => cb.addEventListener("change", () => { if (cb.checked) PC.comps.add(cb.dataset.p); else PC.comps.delete(cb.dataset.p); renderAll(); }));
    panel.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { PC.comps = b.dataset.a === "all" ? new Set(have) : new Set(); renderAll(); }));
    const on = have.filter(p => PC.comps.has(p)).length;
    document.getElementById("p-comps-sum").textContent = on === have.length ? `Все (${have.length})` : `${on} из ${have.length}`;
  }
  document.getElementById("p-reset").addEventListener("click", () => { pcReset(); PC.cdata = "all"; PC.per = "3"; PC.cut = "rooms"; PC.pay = "all"; ["pc.cdata", "pc.per", "pc.cut", "pc.pay"].forEach(k => store.set(k, PC[k.slice(3)])); renderAll(); });

  function renderPcKpis(V, T) {
    const per = pcPer(V.ms), on = ru(latest), sd = pst(V.dOwn), so = pst(V.oOwn);
    const nP = L => new Set(L.map(r => r.p)).size;
    // плитки двумя группами: сначала экспозиция, потом сделки; плашка «дешевле / дороже медианы» — под плитками группы
    const sq = a => `ср. площадь ${nf1.format(a)}&nbsp;м²`;
    const groups = [
      [`Экспозиция на ${on}`, [
        { own: true, label: `${V.lbl} · цена м² экспозиции`, val: so ? th(so.ppm) : "—", unit: "тыс. ₽",
          sub: so ? `${nf0.format(so.n)} лот. · ${sq(so.area)}` : "нет лотов в продаже" },
        { label: "Медиана экспозиции конкурентов", val: T.E ? th(T.E.med) : "—", unit: "тыс. ₽/м²", sub: `${nP(V.oComp)} проектов${T.E && T.E.area ? ` · ${sq(T.E.area)}` : ""}` }],
        pill(T.E && T.E.dev, `${V.lbl}, экспозиция`)],
      [`Сделки ${per}${PC.pay === "mort" ? " · с ипотекой" : PC.pay === "cash" ? " · без ипотеки" : ""}`, [
        { own: true, label: `${V.lbl} · цена м² сделок`, val: sd ? th(sd.ppm) : "—", unit: "тыс. ₽",
          sub: sd ? `${nf0.format(sd.n)} сд. · ${sq(sd.area)}` : "нет сделок за период" },
        { label: "Медиана сделок конкурентов", val: T.D ? th(T.D.med) : "—", unit: "тыс. ₽/м²", sub: `${nP(V.dComp)} проектов${T.D && T.D.area ? ` · ${sq(T.D.area)}` : ""}` },
        { label: "Сделок конкурентов в сравнении", val: nf0.format(V.dComp.length), sub: `${nP(V.dComp)} проектов` }],
        pill(T.D && T.D.dev, `${V.lbl}, сделки`)]
    ];
    const tile = t => `<div class="kpi${t.own ? " own" : ""}"><span class="k-label">${esc(t.label)}</span><span class="k-val">${t.val}${t.unit && t.val !== "—" ? `<small>${t.unit}</small>` : ""}</span><span class="k-sub">${t.sub || "&nbsp;"}</span></div>`;
    document.getElementById("p-kpis").innerHTML = groups.map(([h, L, note]) => `<div class="kgroup"><h3 class="kgroup-h">${esc(h)}</h3><div class="kgroup-tiles">${L.map(tile).join("")}</div><div class="kgroup-note">${note}</div></div>`).join("");
    const note = document.getElementById("p-note");
    note.innerHTML = V.later.length ? `<b>Период ${per}:</b> сделки берутся до последнего месяца, за который в выгрузке Объектива есть сделки конкурентов. Наши сделки за ${V.later.map(monthLong).join(", ")} в сравнение не входят — у конкурентов ${V.later.length > 1 ? "этих месяцев" : "этого месяца"} ещё нет.` : "";
    note.hidden = !note.innerHTML;
  }

  // сделки с начала года по месяцам: наш проект и выбранные конкуренты; переключатель — число сделок (по умолчанию), цена м² или средняя площадь сделки
  const PC_MMODE = { cnt: "Сделок, шт.", ppm: "Цена м², тыс. ₽", area: "Ср. площадь, м²" };
  PC.mmode = PC_MMODE[store.get("pc.mmode2")] ? store.get("pc.mmode2") : "cnt";
  function renderPcMonths(V) {
    const ms = [], last = V.to;
    for (let m = (D.year || last.slice(0, 4)) + "-01"; m <= last; m = +m.slice(5) === 12 ? `${+m.slice(0, 4) + 1}-01` : `${m.slice(0, 4)}-${String(+m.slice(5) + 1).padStart(2, "0")}`) ms.push(m);
    const ok = r => r.area > 0 && r.budget > 0 && r.month >= ms[0] && r.month <= last;
    const own = cOwnRows(CS.loc).filter(r => ok(r) && payOk(r)), comp = CROWS.filter(r => PC.comps.has(r.p) && ok(r) && payOk(r));
    const byP = {}; comp.forEach(r => (byP[r.p] = byP[r.p] || []).push(r));
    // наш проект стоит на своём месте в общем порядке по числу сделок за год; итог по конкурентам — в конце
    const rows = [{ p: V.lbl, own: true, L: own }].concat(Object.keys(byP).map(p => ({ p, L: byP[p] }))).sort((a, b) => b.L.length - a.L.length)
      .concat(comp.length ? [{ p: "Все выбранные конкуренты", mkt: true, L: comp }] : []);
    const md = PC.mmode;
    // в режиме «шт.» — без долей (по просьбе пользователя, 26.11.2026)
    const val = L => { const s = pst(L); if (!s) return `<span class="muted">—</span>`;
      return md === "cnt" ? nf0.format(s.n) : `<span title="${nf0.format(s.n)} сд.">${md === "area" ? nf1.format(s.area) : th(s.ppm)}</span>`; };
    // отделка проекта (отдельный столбец) — по лотам в продаже: один вид (≥ 90 % лотов) или все виды с долей
    const lotsOf = r => r.mkt ? [] : r.own ? (byProject[LOCS[CS.loc].own] || []).filter(x => ownOffer(CS.loc, x)) : (byProject[r.p] || []);
    const finTxt = r => {
      const c = {}; lotsOf(r).forEach(x => { if (x.fl) c[x.fl] = (c[x.fl] || 0) + 1; });
      const n = Object.values(c).reduce((a, b) => a + b, 0), L = Object.entries(c).sort((a, b) => b[1] - a[1]);
      if (!n) return "";
      return (L[0][1] / n >= .9 ? L[0][0] : L.map(([f, k]) => `${f} ${nf0.format(k / n * 100)}%`).join(" · ")) + (FIN_OPTION.has(r.p) ? " · чистовая — опция" : "");
    };
    // РВЭ — ближайшая будущая «Планируемая дата ввода» среди корпусов с лотами в продаже («дек 26»); все корпуса уже введены — «введён»
    const rvTxt = r => {
      const ds = uniq(lotsOf(r).map(x => x.plan)), fut = ds.filter(d => d >= latest);
      return fut.length ? monthLabel(fut[0].slice(0, 7)) : ds.length ? "введён" : "";
    };
    segGroup("p-mmode", Object.entries(PC_MMODE), PC.mmode, v => { PC.mmode = v; store.set("pc.mmode2", v); });
    document.getElementById("p-mon-title").textContent = `Сделки ${ms[0].slice(0, 4)} года по месяцам: ${md === "cnt" ? "количество" : md === "area" ? "средняя площадь" : "цена м²"}${PC.pay === "mort" ? " · с ипотекой" : PC.pay === "cash" ? " · без ипотеки" : ""}`;
    document.getElementById("p-mon-sub").textContent = `${md === "cnt" ? "Сделок, шт." : md === "area" ? "Средняя площадь сделки, м² (с коэф. 0,3/0,5)" : "Цена м², тыс. ₽ — сумма договоров к сумме площадей с коэф. 0,3/0,5"} · ${monthLong(ms[0])} – ${monthLong(last)} · все комнатности · конкуренты — по фильтру, по убыванию числа сделок за год${md === "cnt" ? "" : " · число сделок — в подсказке"} · отделка и РВЭ — по лотам в продаже на ${ru(latest)}; РВЭ — ближайшая плановая дата ввода корпуса`;
    document.getElementById("tbl-pmon").innerHTML = `<thead><tr><th class="l">Проект</th><th class="l">Отделка</th>${ms.map(m => `<th>${monthLabel(m)}</th>`).join("")}<th class="vl">${ms[0].slice(0, 4)}</th><th class="vl">РВЭ</th></tr></thead><tbody>` +
      rows.map(r => `<tr class="${r.own ? "own-row" : r.mkt ? "mkt-row" : ""}"><td>${esc(r.p)}</td><td class="l fin">${esc(finTxt(r))}</td>${ms.map(m => `<td>${val(r.L.filter(x => x.month === m))}</td>`).join("")}<td class="vl"><b>${val(r.L)}</b></td><td class="vl fin rv">${esc(rvTxt(r))}</td></tr>`).join("") + "</tbody>";
  }

  // таблица нашего проекта по комнатности: сделки за период и лоты в продаже
  function renderPcOwn(V, R) {
    const isA = PC.cut === "area";
    document.getElementById("p-own-title").textContent = `${V.lbl} — ${isA ? "по комнатности и площади, шаг 5 м²" : "по комнатности"}`;
    document.getElementById("p-own-sub").textContent = `Цена м², тыс. ₽: сделки ${pcPer(V.ms)} — сумма договоров к сумме площадей с коэф. 0,3/0,5; экспозиция на ${ru(latest)} — ${PC_PRICE[PC.price][1]}, площадь с коэф. 1`;
    const cells = s => s ? `<td class="vl">${nf0.format(s.n)}</td><td class="ppm">${th(s.ppm)}</td><td>${mln(s.budget)}</td><td>${nf1.format(s.area)}</td>` : `<td class="vl">—</td><td>—</td><td>—</td><td>—</td>`;
    const rows = R.filter(a => a.own.sd || a.own.so);
    // по площади — как в БАЗА-РЖД: строка-итог комнатности (▸ раскрывает), под ней диапазоны по 5 м², по умолчанию свёрнуты
    const types = uniq(rows.map(a => a.t)), allOpen = isA && types.length && types.every(t => PC.open.has(t));
    const typeRow = t => { const f = L => L.filter(r => r.rooms === t), o = PC.open.has(t);
      return `<tr class="sub-tot grp" data-t="${esc(t)}" tabindex="0" aria-expanded="${o}"><td><span class="car" aria-hidden="true">${o ? "▾" : "▸"}</span>${ROOM_LONG[t]}</td>${cells(pst(f(V.dOwn)))}${cells(pst(f(V.oOwn)))}</tr>`; };
    document.getElementById("tbl-pown").innerHTML = `<thead><tr><th class="l" rowspan="2">${isA ? `Тип и площадь <button type="button" class="link-btn grp-all">${allOpen ? "свернуть все" : "развернуть все"}</button>` : "Тип"}</th><th class="grp vl" colspan="4">Сделки ${pcPer(V.ms)}</th><th class="grp vl" colspan="4">Экспозиция на ${ru(latest)}</th></tr>
      <tr><th class="vl">Сделок</th><th>Цена м², тыс. ₽</th><th>Ср. бюджет, млн</th><th>Ср. площадь, м²</th><th class="vl">Лотов</th><th>Цена м², тыс. ₽</th><th>Ср. бюджет, млн</th><th>Ср. площадь, м²</th></tr></thead><tbody>` +
      rows.map((a, i) => (isA && (i === 0 || rows[i - 1].t !== a.t) ? typeRow(a.t) : "") + `<tr data-r="${esc(a.x)}"${isA ? ` class="in-grp"${PC.open.has(a.t) ? "" : " hidden"}` : ""}><td>${isA ? a.short : a.label}</td>${cells(a.own.sd)}${cells(a.own.so)}</tr>`).join("") +
      `<tr class="tot"><td>Итого</td>${cells(pst(V.dOwn))}${cells(pst(V.oOwn))}</tr></tbody>`;
    document.querySelectorAll("#tbl-pown tr[data-r]").forEach(tr => tr.addEventListener("click", () => { const el = document.getElementById("pc-g" + tr.dataset.r); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }));
    const saveOpen = () => store.set("pc.open", JSON.stringify([...PC.open]));
    const tgl = t => { if (PC.open.has(t)) PC.open.delete(t); else PC.open.add(t); saveOpen(); renderPcOwn(V, R); };
    document.querySelectorAll("#tbl-pown tr.grp").forEach(tr => { tr.addEventListener("click", () => tgl(tr.dataset.t)); tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tgl(tr.dataset.t); } }); });
    const ga = document.querySelector("#tbl-pown .grp-all");
    if (ga) ga.addEventListener("click", e => { e.stopPropagation(); PC.open = allOpen ? new Set() : new Set(types); saveOpen(); renderPcOwn(V, R); });
  }

  // подписи столбцов: над столбцом — цена (тыс. ₽/м²) и бюджет (млн ₽), на столбце — средняя площадь, м²
  const barLabels = {
    id: "barLabels",
    afterDatasetsDraw(chart, args, o) {
      const { ctx } = chart; ctx.save(); ctx.textAlign = "center";
      chart.data.datasets.forEach((d, di) => chart.getDatasetMeta(di).data.forEach((bar, i) => {
        const v = d.data[i]; if (v == null) return;
        const s = d.st[i], col = o.items[i].own ? o.own : o.ink;
        // соседний столбик той же пары почти той же высоты — подпись более высокого поднимаем над подписью соседнего
        const oi = 1 - di, ov = chart.data.datasets[oi].data[i], ob = chart.getDatasetMeta(oi).data[i];
        const ty = ov != null && ob && Math.abs(ob.y - bar.y) < 30 && (bar.y < ob.y || bar.y === ob.y && di === 1) ? Math.min(bar.y, ob.y - 30) : bar.y;
        ctx.fillStyle = col; ctx.textBaseline = "bottom";
        ctx.font = `600 11.5px ${Chart.defaults.font.family}`; ctx.fillText(nf0.format(v / 1000) + " тыс.", bar.x, ty - 17);
        ctx.font = `500 11px ${Chart.defaults.font.family}`; ctx.fillText(nf1.format(s.budget / 1e6) + " млн", bar.x, ty - 4);
        if (bar.base - bar.y < 30) return;
        const t = nf1.format(s.area); ctx.font = `600 11px ${Chart.defaults.font.family}`;
        const w = ctx.measureText(t).width + 10, h = 18, y = bar.base - h - 6;
        ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.roundRect(bar.x - w / 2, y, w, h, 6); ctx.fill();
        ctx.fillStyle = col; ctx.textBaseline = "middle"; ctx.fillText(t, bar.x, y + h / 2 + .5);
      }));
      ctx.restore();
    }
  };
  const roomCharts = [];
  function renderPcCharts(V, R) {
    roomCharts.splice(0).forEach(c => c.destroy());
    const sD = PC.cdata !== "e", sE = PC.cdata !== "d";
    const shown = R.filter(a => a.own.sd || a.own.so || a.comps.length);
    const per = pcPer(V.ms), on = ru(latest);
    const order = PC.cdata === "e" ? "проекты — по убыванию цены экспозиции" : PC.cdata === "d" ? "проекты со сделками — по убыванию цены сделок" : "проекты — по убыванию цены сделок (без сделок — по цене экспозиции)";
    document.getElementById("p-charts").innerHTML = shown.map(a => `<article class="card full" id="pc-g${esc(a.x)}">
        <h2>${a.label}: цена м², бюджет и площадь</h2>
        <p class="sub">Над столбцом — цена (тыс. ₽/м²) и бюджет (млн ₽), на столбце — средняя площадь, м² · под названием — сделки за ${per} и лоты в продаже на ${on} (экспозиция от периода не зависит) · ${order}</p>
        <div class="badges">${pill(a.own.sd && a.medD ? a.own.sd.ppm / a.medD - 1 : null, `${V.lbl}, сделки`)}${pill(a.own.so && a.medE ? a.own.so.ppm / a.medE - 1 : null, `${V.lbl}, экспозиция`)}</div>
        <div class="chart-scroll"><div class="chart-box"><canvas aria-label="График: ${a.label}"></canvas></div></div>
        <div class="legend-row">${sD ? `<span><span class="sw" style="background:var(--r3)"></span>Сделки ${per}</span>` : ""}${sE ? `<span><span class="sw" style="background:var(--comp)"></span>Экспозиция на ${on}</span>` : ""}<span><span class="sw" style="background:var(--own)"></span>${esc(V.lbl)}: сделки</span><span><span class="sw" style="background:var(--w3)"></span>${esc(V.lbl)}: экспозиция</span></div>
      </article>`).join("") || `<article class="card full"><div class="empty">Нет данных при выбранных фильтрах</div></article>`;
    const B = baseOpts(), c = k => cssv(k);
    shown.forEach(a => {
      // наш проект — всегда оба столбика; конкуренты — по переключателю «На графиках»
      const items = [a.own].concat(a.comps.filter(i => sD && i.sd || sE && i.so));
      const rk = i => PC.cdata === "e" && !i.own ? (i.so ? i.so.ppm : 0) : (i.sd || i.so || { ppm: 0 }).ppm;
      items.sort((x, y) => rk(y) - rk(x));
      const showD = i => i.own || sD, showE = i => i.own || sE;
      const box = document.getElementById("pc-g" + a.x).querySelector(".chart-box");
      box.style.minWidth = Math.max(560, items.length * (PC.cdata === "all" ? 96 : 72)) + "px";
      const ds = (label, key, show, ownC, compC) => ({ label, st: items.map(i => i[key]), data: items.map(i => show(i) && i[key] ? i[key].ppm : null),
        backgroundColor: items.map(i => c(i.own ? ownC : compC)), borderRadius: { topLeft: 5, topRight: 5 }, borderSkipped: "bottom", maxBarThickness: 56, categoryPercentage: .8, barPercentage: .9 });
      roomCharts.push(new Chart(box.querySelector("canvas"), {
        type: "bar",
        // подписи в порядке столбиков: сначала сделки за период, потом лоты в продаже на дату среза
        data: { labels: items.map(i => wrapLabel(i.p, 13).concat(showD(i) && i.sd ? [`${nf0.format(i.sd.n)} сд.`] : [], showE(i) && i.so ? [`${nf0.format(i.so.n)} лот.`] : [])),
          datasets: [ds(`Сделки ${per}`, "sd", showD, "--own", "--r3"), ds(`Экспозиция на ${on}`, "so", showE, "--w3", "--comp")] },
        options: Object.assign({}, B, {
          skipNull: true, layout: { padding: { top: 64 } },
          scales: { x: { grid: { display: false }, border: { color: B.grid }, ticks: { autoSkip: false, maxRotation: 0, color: ctx => items[ctx.index] && items[ctx.index].own ? c("--own") : B.ink2, font: ctx => ({ weight: items[ctx.index] && items[ctx.index].own ? "700" : "500", lineHeight: 1.25 }) } },
                    y: { beginAtZero: true, grace: "12%", grid: { color: B.grid }, border: { display: false }, ticks: { callback: v => nf0.format(v / 1000) }, title: { display: true, text: "тыс. ₽/м²", color: B.muted } } },
          plugins: { legend: { display: false }, barLabels: { items, own: c("--own"), ink: B.ink },
            tooltip: Object.assign({}, B.plugins.tooltip, { callbacks: { title: x => items[x[0].dataIndex].p, label: x => { const s = x.dataset.st[x.dataIndex]; return s ? `${x.dataset.label}: ${nf0.format(s.ppm)} ₽/м² · бюджет ${mln(s.budget)} млн ₽ · ${nf1.format(s.area)} м² · ${nf0.format(s.n)} ${x.datasetIndex ? "лот." : "сд."}` : ""; } } }) }
        }),
        plugins: [barLabels]
      }));
    });
  }

  function renderPc() {
    renderPcFilters();
    const V = pcView(), R = pcGroups(V).map(g => pcRoom(V, g)), T = pcTotal(R);
    renderPcKpis(V, T); renderPcMonths(V); renderPcOwn(V, R); renderPcCharts(V, R);
    document.getElementById("p-method").innerHTML =
      `<div><b>Сделки.</b> Наши — таблица «Сделки — сводная», лист «Все сделки» (${esc(V.lbl)}): цена в договоре, площадь с коэф. 0,3/0,5 (столбец J). Конкуренты — лист «Сделки» книги конкурентов (выгрузка Объектива «Сделки (ДДУ+ДКП)»), площадь сводная с коэф. 0,3/0,5; конкуренты вне группы «Наши конкуренты» Объектива — из листа «Сделки_Екб». Период — переключатель «Сделки» (месяц, 3 или 6 месяцев, весь год) до последнего месяца, за который есть сделки конкурентов: сейчас ${monthLong(V.from)} – ${monthLong(V.to)}; наши сделки — за тот же период.</div>` +
      `<div><b>Экспозиция.</b> Лоты в продаже из листа «Конкуренты рабочая» (последний срез Объектива, цены на ${ru(latest)}), как в разделе «Предложение». ${CS.loc === "dmd2" ? "Наш проект — «Милый дом (BAZA)», корпус 2 (ДМД2). " : ""}Цена (переключатель): со скидкой и отделкой — «Цена со скидкой» (прайс × скидка проекта из справочника + корректировка на отделку × площадь); со скидкой и без корректировки на отделку — та же цена без поправки на отделку; прайс — цена предложения. Площадь с коэф. 1.</div>` +
      `<div><b>Расчёт.</b> Цена м² — сумма цен к сумме площадей, бюджет — средняя цена сделки или лота. Медиана — медиана цен м² выбранных конкурентов в группе разреза (комнатность или диапазон площади 5 м²; сделки и экспозиция отдельно); на плитках медианы групп взвешены по нашей площади: для сделок — по площади наших сделок, для экспозиции — наших лотов. «Дешевле / дороже медианы» — наша цена м² к медиане. Состав конкурентов — справочник: для Алисы её список, для ДМД2 — список «Милого дома». Сделки конкурентов попадают в выгрузку после регистрации договора, поэтому последний месяц может быть неполным.</div>` +
      `<div><b>Оплата.</b> Фильтр «Оплата» действует на все сделки страницы. Ипотека: наши сделки — «Тип оплаты» = «Ипотека» в «Все сделки», конкуренты — «Тип обременения» с ипотекой в выгрузке Объектива. Экспозицию фильтр не меняет.</div>` +
      `<div><b>Сделки по месяцам.</b> Те же сделки с января по ${monthLong(V.to)}: наши — без месяцев, которых ещё нет в выгрузке конкурентов; «Все выбранные конкуренты» — сумма договоров к сумме площадей по всем выбранным конкурентам вместе.</div>` +
      `<div><b>Обновление.</b> Данные загружаются из таблиц автоматически каждый день; последняя сборка — ${esc(D.built)}.</div>`;
  }


  // ---------- локации и отрисовка ----------
  function renderTabs() {
    const el = document.getElementById("tabs");
    el.innerHTML = Object.entries(LOCS).map(([k, L]) => `<button class="tab" role="tab" aria-selected="${k === CS.loc}" data-l="${k}">${esc(L.label)}<span class="cnt">${cOwnRows(k).filter(r => { const ms = pcMonths(); return r.month >= ms[0] && r.month <= ms[ms.length - 1]; }).length}</span></button>`).join("");
    el.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
      if (CS.loc === b.dataset.l) return;
      CS.loc = b.dataset.l; store.set("pc.loc", CS.loc); pcReset();
      try { history.replaceState(null, "", "#" + CS.loc); } catch (e) {}
      renderAll();
    }));
  }
  function renderAll() {
    const ms = pcMonths();
    document.getElementById("asof").textContent = `${LOCS[CS.loc].label} и конкуренты · сделки ${ms.length ? monthLong(ms[0]) + " – " + monthLong(ms[ms.length - 1]) : ""}, экспозиция на ${ru(latest)}`;
    renderTabs(); renderPc();
  }

  // высота шапки для закреплённых фильтров; тень у фильтров, когда они прилипли
  (function () {
    const hdr = document.querySelector("header.top"), flt = document.querySelector("#view-ccmp > .filters");
    const setH = () => document.documentElement.style.setProperty("--hdr-h", hdr.offsetHeight + "px");
    setH(); if (window.ResizeObserver) new ResizeObserver(setH).observe(hdr); else window.addEventListener("resize", setH);
    window.addEventListener("scroll", () => flt.classList.toggle("stuck", flt.getBoundingClientRect().top <= hdr.offsetHeight + 9 && window.scrollY > 40), { passive: true });
  })();
  const h = (location.hash || "").slice(1);
  CS.loc = LOCS[h] ? h : (LOCS[store.get("pc.loc")] ? store.get("pc.loc") : "alisa");
  pcReset();
  if (typeof Chart === "undefined") {
    document.querySelectorAll(".chart-box").forEach(b => b.innerHTML = `<div class="empty">Не удалось загрузить библиотеку графиков. Проверьте доступ к cdnjs.cloudflare.com</div>`);
    window.Chart = function () { return { destroy() {} }; }; window.Chart.defaults = { font: {} };
  }
  renderAll();
})();
</script>
</body>
</html>
